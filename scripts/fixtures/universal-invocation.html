<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>UAI — проверка вызовов</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f3;color:#202624;font:16px/1.5 system-ui,sans-serif}main{max-width:1100px;margin:48px auto;padding:0 24px}header{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:32px}h1{font-size:28px;letter-spacing:-.7px;margin:0 0 8px}p{margin:0;color:#626b65}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}section,form{background:white;padding:24px;border:1px solid #dce0dc;border-radius:12px}label{display:block;font-weight:600;margin:0 0 8px}textarea,select,input[type=number]{font:inherit;border:1px solid #c6cec7;border-radius:6px;width:100%;padding:10px;background:#fff;color:inherit;margin-bottom:20px}textarea{min-height:120px;resize:vertical}button{font:inherit;border:1px solid #bcc7bd;border-radius:6px;padding:9px 15px;background:white;color:inherit;cursor:pointer}button.primary{background:#275b43;border-color:#275b43;color:white}button:disabled{opacity:.5;cursor:default}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.wallet{font-size:14px;text-align:right}.wallet strong{font-size:20px;display:block}.hint{font-size:13px;margin:6px 0 18px}#status{font-size:14px;color:#52665a;margin-bottom:16px}#output{min-height:180px;white-space:pre-wrap;overflow-wrap:anywhere}#error,#warning{color:#a23728;white-space:pre-wrap;margin-top:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:300px;overflow:auto}summary{cursor:pointer}h2{font-size:18px;margin:0 0 16px}.small{font-size:13px;color:#626b65}#asset{font-size:13px;overflow-wrap:anywhere;margin:6px 0}input[type=file]{max-width:100%}@media(max-width:700px){main{margin:24px auto}.grid{grid-template-columns:1fr}header{display:block}.wallet{text-align:left;margin-top:20px}}
</style>
<main><header><div><h1>Проверка универсальных вызовов</h1><p>Изолированный стенд. Ответы синтетические, платных вызовов нет.</p></div><div class="wallet"><strong id="available">Загружаем баланс…</strong><span id="reserved"></span><div id="warning" role="status"></div></div></header>
<div class="grid"><form id="form"><label for="mode">Результат</label><select id="mode"><option value="text">Текст</option><option value="structured">Структурированный ответ</option><option value="tool">Один вызов инструмента</option><option value="retry">Дефект и новая попытка</option><option value="refused">Отказ модели</option><option value="slow">Медленный ответ</option></select><label for="prompt">Сообщение</label><textarea id="prompt">Опиши изображение и предложи следующий шаг.</textarea><label for="file">Изображение</label><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><div id="asset">Без изображения</div><p class="hint">Файл загружается один раз и может использоваться в следующих вызовах.</p><label for="attempts">Максимум попыток</label><input id="attempts" type="number" min="1" max="8" value="4"><div class="buttons"><button class="primary" id="run">Выполнить</button></div><div id="error" role="alert"></div></form>
<section><h2>Ответ</h2><div id="status" role="status">Готов к вызову</div><div id="output" aria-live="polite"></div><div class="buttons"><button type="button" id="disconnect" disabled>Отключить поток</button><button type="button" id="reconnect" disabled>Переподключиться</button><button type="button" id="cancel" disabled>Отменить запрос</button></div><p id="timing" class="hint"></p><details><summary>Итоговый объект и измерения</summary><pre id="result"></pre></details><details><summary>События попыток</summary><pre id="events"></pre></details></section></div></main>
<script>
const $=id=>document.getElementById(id);let assetId,requestId,controller,started,firstDelta,attempt=0,generation=0n,sequence=0;let revision=-1;
const credits=value=>(Number(value)/1000000).toLocaleString('ru',{maximumFractionDigits:6})+' кр.';
const wallet=new EventSource('/wallet/events');wallet.onmessage=e=>{const value=JSON.parse(e.data);if(value.revision<=revision)return;revision=value.revision;$('available').textContent=credits(value.available_units)+' доступно';$('reserved').textContent=credits(value.reserved_units)+' в резерве';$('warning').textContent=BigInt(value.available_units)<0n?'Есть долг. Новый вызов требует пополнения.':'';};
$('file').onchange=async()=>{const file=$('file').files[0];if(!file)return;try{$('asset').textContent='Загрузка…';const bytes=new Uint8Array(await file.arrayBuffer());let binary='';for(const byte of bytes)binary+=String.fromCharCode(byte);const response=await fetch('/upload',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({base64:btoa(binary),media_type:file.type,key:crypto.randomUUID()})});const data=await response.json();if(!response.ok)throw Error(data.error??'Ошибка загрузки');assetId=data.id;$('asset').textContent=file.name+' · готов к повторному использованию';}catch(error){$('error').textContent=error.message;}};
function event(value){
 if(value.type==='accepted'){requestId=value.request_id;$('cancel').disabled=false;$('status').textContent='Запрос принят';}
 if(value.type==='attempt'){if(value.attempt_number<attempt)return;attempt=value.attempt_number;generation=BigInt(value.generation);sequence=value.sequence??0;$('output').textContent='';$('status').textContent='Попытка '+attempt+(value.gap?' · часть предварительного ответа пропущена':'');$('events').textContent+='Попытка '+attempt+'\n';}
 if(value.type==='delta'){if(value.attempt_number<attempt||BigInt(value.generation)<generation||value.sequence<=sequence)return;if(value.attempt_number>attempt){attempt=value.attempt_number;generation=BigInt(value.generation);$('output').textContent='';sequence=0;}sequence=value.sequence;if(!firstDelta){firstDelta=performance.now();$('timing').textContent='Первое содержимое: '+Math.round(firstDelta-started)+' мс';}$('output').textContent+=value.text;}
 if(value.type==='result'){const content=value.result.result?.content;$('output').textContent=content?.type==='refused'?content.reason:content?.type==='tool_call'?JSON.stringify({name:content.name,arguments:content.arguments},null,2):content?.type==='structured'?content.value.reply:content?.text??'Содержимое уже передано приложению или недоступно.';$('result').textContent=JSON.stringify(value.result,null,2);$('status').textContent=value.result.execution_status==='refused'?'Модель отказала':value.result.execution_status==='canceled'?'Запрос отменён':value.result.execution_status==='failed'?'Запрос завершился ошибкой':value.result.execution_status==='succeeded'?'Завершено · результат сохранён до ACK':'Исход уточняется';$('cancel').disabled=true;$('reconnect').disabled=false;}
}
async function read(url,body){controller=new AbortController();$('disconnect').disabled=false;$('run').disabled=true;try{const response=await fetch(url,{method:body?'POST':'GET',headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined,signal:controller.signal});if(!response.ok){const error=await response.json();throw Error(error.error??'Ошибка вызова');}const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const chunk=await reader.read();if(chunk.done)break;buffer+=decoder.decode(chunk.value,{stream:true});let end;while((end=buffer.indexOf('\n\n'))>=0){const frame=buffer.slice(0,end);buffer=buffer.slice(end+2);for(const line of frame.split('\n'))if(line.startsWith('data: '))event(JSON.parse(line.slice(6)));}}}catch(error){if(error.name!=='AbortError')$('error').textContent=error.message;}finally{$('run').disabled=false;$('disconnect').disabled=true;if(requestId)$('reconnect').disabled=false;}}
$('form').onsubmit=e=>{e.preventDefault();$('error').textContent='';$('events').textContent='';$('result').textContent='';$('output').textContent='';$('timing').textContent='';attempt=0;sequence=0;generation=0n;requestId=undefined;firstDelta=undefined;started=performance.now();const mode=$('mode').value,blocks=[{type:'text',text:$('prompt').value}];if(assetId)blocks.push({type:'image',asset_id:assetId});blocks.push({type:'text',text:'Заверши ответ кратко.'});const input={messages:[{role:'user',content:blocks}],instructions:'fixture:'+mode};const schema={type:'object',properties:{reply:{type:'string',minLength:12},count:{type:'integer',minimum:1}},required:['reply','count'],additionalProperties:false};if(['structured','retry'].includes(mode))input.response_schema=schema;if(mode==='tool'){input.tools=[{name:'next_step',parameters:schema}];input.tool_choice={type:'required'};}void read('/run',{key:crypto.randomUUID(),input,max_attempts:Number($('attempts').value),field_paths:['structured','retry','tool'].includes(mode)?['/reply']:[]});};
$('disconnect').onclick=()=>{controller?.abort();$('status').textContent='Поток отключён. Генерация продолжается.';};$('reconnect').onclick=()=>read('/resume?id='+encodeURIComponent(requestId));$('cancel').onclick=async()=>{if(requestId){await fetch('/cancel',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({request_id:requestId})});$('status').textContent='Отмена запрошена';}};
</script></html>
