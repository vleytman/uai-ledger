name: Product admin compatibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # For private cross-repository access configure a read-only token
          # or GitHub App token. Dependabot also needs access to the UAI repo.
          token: ${{ secrets.UAI_READ_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      # Add product-specific admin/API tests here before making this a release gate.
      # This job does not migrate databases or deploy anything.
