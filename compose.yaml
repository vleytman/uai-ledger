services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - uai_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: uai
      POSTGRES_PASSWORD: uai_local_only
      POSTGRES_DB: uai
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - uai_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uai -d uai"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  uai_redis:
  uai_postgres:
