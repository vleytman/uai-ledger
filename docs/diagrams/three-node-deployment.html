<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where the distributed services run</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { height: auto; width: 100%; min-width: 1280px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>

fill="#4f5d75" text-anchor="end">pinned image</text><rect x="312" y="416" width="272" height="176" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="328" y="436" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#4f5d75" text-anchor="start">HOST · compose.workers</text><text x="328" y="460" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="start">Execution node</text><rect x="328" y="476" width="240" height="24" rx="4" fill="#ececec" stroke="#bfc0c0"/><text x="336" y="492" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="start">Generation</text><text x="560" y="492" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="end">pinned image</text><rect x="328" y="508" width="240" height="24" rx="4" fill="#ececec" stroke="#bfc0c0"/><text x="336" y="524" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="start">Observation</text><text x="560" y="524" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="end">same image</text><rect x="328" y="540" width="240" height="24" rx="4" fill="#ececec" stroke="#bfc0c0"/><text x="336" y="556" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="start">Maintenance</text><text x="560" y="556" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="end">same image</text><rect x="680" y="240" width="256" height="208" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="696" y="260" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#4f5d75" text-anchor="start">HOST · compose.data</text><text x="696" y="284" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="start">Data node</text><rect x="696" y="300" width="224" height="24" rx="4" fill="#ececec" stroke="#bfc0c0"/><text x="704" y="316" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="start">PostgreSQL</text><text x="912" y="316" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="end">17</text><rect x="696" y="332" width="224" height="24" rx="4" fill="#ececec" stroke="#bfc0c0"/><text x="704" y="348" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="start">Redis</text><text x="912" y="348" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="end">7.4 + AOF</text><rect x="1032" y="304" width="176" height="128" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="1048" y="324" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#4f5d75" text-anchor="start">SHARED SERVICE</text><text x="1048" y="348" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="start">S3-compatible store</text><rect x="1048" y="364" width="144" height="24" rx="4" fill="#ececec" stroke="#bfc0c0"/><text x="1056" y="380" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="start">BlobStore</text><text x="1184" y="380" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="end">same prefix</text><line x1="40" y1="660" x2="1240" y2="660" stroke="#bfc0c0"/><text x="40" y="684" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">Three UAI hosts; reverse proxy and API share the application host. The API listens on loopback.</text><text x="40" y="700" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">API, scheduler and workers use one pinned image. Data ports are private; provider egress and manual migrations are omitted.</text></svg></div></div></body></html>
