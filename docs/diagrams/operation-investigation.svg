<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="600" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="operation-investigation-title operation-investigation-desc" id="operation-investigation-root"><title id="operation-investigation-title">Follow an operation down to the evidence</title><desc id="operation-investigation-desc">Start from an operation, inspect its requests and attempts, then compare usage and provider costs with the separate customer wallet journal.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #operation-investigation-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #operation-investigation-root { font-family: var(--font-sans); color: var(--color-ink); }
      #operation-investigation-root .diagram-container { width: 100%; overflow-x: auto; }
      #operation-investigation-root .diagram-container { overflow-x: visible; }</style><marker id="operation-investigation-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="operation-investigation-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="operation-investigation-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker></defs><rect width="960" height="600" fill="#f5f5f5"/><text x="40" y="72" font-family="'Instrument Serif',serif" font-size="28" font-weight="400" fill="#2d3142" text-anchor="start">Follow an operation down to the evidence</text><text x="40" y="100" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#4f5d75" text-anchor="start">TREE · OPERATION INVESTIGATION</text><path d="M 264,256 V 232 Q 264,224 272,224 H 704 Q 712,224 712,232 V 256" fill="none" stroke="#4f5d75" stroke-width="1.4"/><path d="M 504,196 V 224" fill="none" stroke="#4f5d75" stroke-width="1.4"/><path d="M 152,368 V 348 Q 152,340 160,340 H 400 Q 408,340 408,348 V 368" fill="none" stroke="#4f5d75" stroke-width="1.4"/><path d="M 264,308 V 340" fill="none" stroke="#4f5d75" stroke-width="1.4"/><path d="M 376,464 V 452 Q 376,444 384,444 H 592 Q 600,444 600,452 V 464" fill="none" stroke="#4f5d75" stroke-width="1.4"/><path d="M 408,420 V 444" fill="none" stroke="#4f5d75" stroke-width="1.4"/><rect x="416" y="144" width="176" height="52" rx="6" fill="#f5f5f5" stroke="#bf4520" stroke-width="2"/><text x="504.0" y="168" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Operation</text><text x="504.0" y="188" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">accepted terms</text><rect x="176" y="256" width="176" height="52" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="264.0" y="280" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Requests</text><text x="264.0" y="300" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">bounded work items</text><rect x="624" y="256" width="176" height="52" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="712.0" y="280" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Wallet postings</text><text x="712.0" y="300" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">customer credit ledger</text><rect x="64" y="368" width="176" height="52" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="152.0" y="392" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Attempt 1</text><text x="152.0" y="412" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">provider submission</text><rect x="320" y="368" width="176" height="52" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="408.0" y="392" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Attempt 2</text><text x="408.0" y="412" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">if retry is permitted</text><rect x="288" y="464" width="176" height="52" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="376.0" y="488" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Usage observations</text><text x="376.0" y="508" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">provider counters</text><rect x="512" y="464" width="176" height="52" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="600.0" y="488" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Provider cost</text><text x="600.0" y="508" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">rated / unknown</text><line x1="40" y1="540" x2="920" y2="540" stroke="#bfc0c0"/><text x="40" y="564" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">Investigation map, not a database schema. Each attempt has its own usage and cost records.</text><text x="40" y="580" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">Only one request branch is expanded. Wallet postings and provider costs are separate views.</text></svg>
