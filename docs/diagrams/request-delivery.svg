<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="600" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="request-delivery-title request-delivery-desc" id="request-delivery-root"><title id="request-delivery-title">Request, persist, then acknowledge</title><desc id="request-delivery-desc">The application accepts a quote, UAI executes the provider call, and the application durably saves the final result before acknowledging delivery.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #request-delivery-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #request-delivery-root { font-family: var(--font-sans); color: var(--color-ink); }
      #request-delivery-root .diagram-container { width: 100%; overflow-x: auto; }
      #request-delivery-root .diagram-container { overflow-x: visible; }</style><marker id="request-delivery-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="request-delivery-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="request-delivery-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker></defs><rect width="960" height="600" fill="#f5f5f5"/><text x="40" y="72" font-family="'Instrument Serif',serif" font-size="28" font-weight="400" fill="#2d3142" text-anchor="start">Request, persist, then acknowledge</text><text x="40" y="100" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#4f5d75" text-anchor="start">SEQUENCE · SUCCESSFUL QUOTED REQUEST</text><line x1="120" y1="192" x2="120" y2="532" stroke="#bfc0c0" stroke-dasharray="3,3"/><line x1="360" y1="192" x2="360" y2="532" stroke="#bfc0c0" stroke-dasharray="3,3"/><line x1="600" y1="192" x2="600" y2="532" stroke="#bfc0c0" stroke-dasharray="3,3"/><line x1="840" y1="192" x2="840" y2="532" stroke="#bfc0c0" stroke-dasharray="3,3"/><path d="M 120,212 H 360" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#request-delivery-arrow)"/><rect x="218.0" y="187" width="44" height="16" fill="#f5f5f5"/><text x="240.0" y="198" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">QUOTE</text><path d="M 360,244 H 120" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#request-delivery-arrow)"/><rect x="218.0" y="219" width="44" height="16" fill="#f5f5f5"/><text x="240.0" y="230" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">TERMS</text><path d="M 120,276 H 360" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#request-delivery-arrow)"/><rect x="202.0" y="251" width="76" height="16" fill="#f5f5f5"/><text x="240.0" y="262" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">INVOKE QUOTE</text><path d="M 360,308 H 120" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#request-delivery-arrow)"/><rect x="206.0" y="283" width="68" height="16" fill="#f5f5f5"/><text x="240.0" y="294" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">REQUEST ID</text><path d="M 360,340 H 600" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#request-delivery-arrow)"/><rect x="452.0" y="315" width="56" height="16" fill="#f5f5f5"/><text x="480.0" y="326" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">DISPATCH</text><path d="M 600,372 H 360" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#request-delivery-arrow)"/><rect x="436.0" y="347" width="88" height="16" fill="#f5f5f5"/><text x="480.0" y="358" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">RESULT + USAGE</text><path d="M 360,404 H 120" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#request-delivery-arrow)"/><rect x="202.0" y="379" width="76" height="16" fill="#f5f5f5"/><text x="240.0" y="390" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">READY RESULT</text><path d="M 120,436 H 840" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#request-delivery-arrow)"/><rect x="684.0" y="411" width="72" height="16" fill="#f5f5f5"/><text x="720" y="422" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">SAVE RESULT</text><path d="M 840,468 H 120" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#request-delivery-arrow)"/><rect x="698.0" y="443" width="44" height="16" fill="#f5f5f5"/><text x="720" y="454" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">SAVED</text><path d="M 120,500 H 360" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#request-delivery-arrow-accent)"/><rect x="202.0" y="475" width="76" height="16" fill="#f5f5f5"/><text x="240.0" y="486" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">ACK DELIVERY</text><rect x="48" y="136" width="144" height="56" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="120.0" y="164" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">App backend</text><text x="120.0" y="184" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">identity / SDK</text><rect x="288" y="136" width="144" height="56" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="360.0" y="164" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">UAI</text><text x="360.0" y="184" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">API + execution</text><rect x="528" y="136" width="144" height="56" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="600.0" y="164" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Provider</text><text x="600.0" y="184" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">model / paid API</text><rect x="768" y="136" width="144" height="56" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="840.0" y="164" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">App storage</text><text x="840.0" y="184" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">permanent result</text><line x1="40" y1="540" x2="920" y2="540" stroke="#bfc0c0"/><text x="40" y="564" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">Successful quoted request. Persist the final result before ACK; stream deltas are provisional.</text></svg>
