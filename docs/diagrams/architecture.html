<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How your application connects to UAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>

e-width="1"/><text x="128.0" y="204" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">App backend</text><text x="128.0" y="224" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">trusted identity</text><rect x="280" y="176" width="176" height="80" rx="6" fill="#f5f5f5" stroke="#bf4520" stroke-width="2"/><text x="368.0" y="204" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">UAI API</text><text x="368.0" y="224" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">quotes / operations</text><rect x="504" y="176" width="176" height="80" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="592.0" y="204" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Workers</text><text x="592.0" y="224" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">execute / settle</text><rect x="744" y="176" width="160" height="80" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="824.0" y="204" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Providers</text><text x="824.0" y="224" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">model / paid API</text><rect x="280" y="352" width="176" height="64" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="368.0" y="380" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">PostgreSQL</text><text x="368.0" y="400" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">journal / s
