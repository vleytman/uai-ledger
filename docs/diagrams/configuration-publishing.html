<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>From Git file to active configuration</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { height: auto; width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body><div class="frame"><div class="diagram-container"><svg width="960" height="600" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="configuration-publishing-title configuration-publishing-desc"><title id="configuration-publishing-title">From Git file to active configuration</title><desc id="configuration-publishing-desc">An author commits definitions and supplies local bindings, the CLI validates and publishes a release, and explicit activation makes it available for new quotes.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker></defs><rect width="960" height="600" fill="#f5f5f5"/><text x="40" y="72" font-family="'Instrument Serif',serif" font-size="28" font-weight="400" fill="#2d3142" text-anchor="start">From Git file to active configuration</text><text x="40" y="100" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#4f5d75" text-anchor="start">SWIMLANE · AUTHORING, PUBLICATION AND RUNTIME</text><rect x="144" y="136" width="776" height="104" fill="#f5f5f5"/><line x1="40" y1="136" x2="920" y2="136" stroke="#bfc0c0"/><text x="48" y="188" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#4f5d75" text-anchor="start">AUTHOR</text><rect x="144" y="240" width="776" height="128" fill="#ececec"/><line x1="40" y1="240" x2="920" y2="240" stroke="#bfc0c0"/><text x="48" y="292" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#4f5d75" text-anchor="start">CLI + DATABASE</text><rect x="144" y="368" width="776" height="144" fill="#f5f5f5"/><line x1="40" y1="368" x2="920" y2="368" stroke="#bfc0c0"/><text x="48" y="420" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#4f5d75" text-anchor="start">RUNTIME</text><path d="M 248,216 V 224 Q 248,232 256,232 H 400 Q 408,232 408,240 V 256" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 456,216 V 256" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 512,292 H 560" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 704,292 H 752" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 824,328 V 416" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/><rect x="176" y="152" width="144" height="64" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="248.0" y="176" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Edit and commit</text><text x="248.0" y="196" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">JSON definitions</text><rect x="352" y="152" width="160" height="64" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="432.0" y="176" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Bind installation</text><text x="432.0" y="196" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">IDs kept outside Git</text><rect x="352" y="256" width="160" height="72" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="432.0" y="280" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Validate + preview</text><text x="432.0" y="300" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">checks roll back</text><rect x="560" y="256" width="144" height="72" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="632.0" y="280" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Publish</text><text x="632.0" y="300" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">immutable release</text><rect x="752" y="256" width="144" height="72" rx="6" fill="#f5f5f5" stroke="#bf4520" stroke-width="2"/><text x="824.0" y="280" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Activate</text><text x="824.0" y="300" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">revision checked</text><rect x="752" y="416" width="144" height="64" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="824.0" y="440" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">New quotes</text><text x="824.0" y="460" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">active definitions</text><text x="352" y="440" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="400" fill="#2d3142" text-anchor="start">Published is not yet active.</text><text x="352" y="464" font-family="'Geist',system-ui,sans-serif" font-size="11" font-weight="400" fill="#4f5d75" text-anchor="start">Accepted work keeps its saved versions.</text><line x1="40" y1="540" x2="920" y2="540" stroke="#bfc0c0"/><text x="40" y="564" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">All CLI stages use the target database. These commands make no provider calls.</text></svg></div></div></body></html>
