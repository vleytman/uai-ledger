<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recover a lost worker without guessing</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { height: auto; width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body><div class="frame"><div class="diagram-container"><svg width="960" height="600" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lease-recovery-title lease-recovery-desc"><title id="lease-recovery-title">Recover a lost worker without guessing</title><desc id="lease-recovery-desc">After a worker lease expires, UAI requeues unsent work, observes a known provider job, reuses guaranteed provider idempotency, or records an unknown outcome.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker></defs><rect width="960" height="600" fill="#f5f5f5"/><text x="40" y="72" font-family="'Instrument Serif',serif" font-size="28" font-weight="400" fill="#2d3142" text-anchor="start">Recover a lost worker without guessing</text><text x="40" y="100" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#4f5d75" text-anchor="start">FLOWCHART · DECISION AFTER LEASE EXPIRY</text><path d="M 420,184 V 216" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 520,256 H 704" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 420,296 V 328" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 520,368 H 704" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 420,408 V 440" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 520,480 H 704" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 320,480 H 240" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/><rect x="596.0" y="231" width="32" height="16" fill="#f5f5f5"/><text x="612" y="242" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">YES</text><rect x="430.0" y="303" width="28" height="16" fill="#f5f5f5"/><text x="444" y="314" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">NO</text><rect x="596.0" y="343" width="32" height="16" fill="#f5f5f5"/><text x="612" y="354" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">YES</text><rect x="430.0" y="415" width="28" height="16" fill="#f5f5f5"/><text x="444" y="426" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">NO</text><rect x="596.0" y="455" width="32" height="16" fill="#f5f5f5"/><text x="612" y="466" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">YES</text><rect x="266.0" y="455" width="28" height="16" fill="#f5f5f5"/><text x="280" y="466" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">NO</text><rect x="320" y="136" width="200" height="48" rx="20" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="420.0" y="160" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Worker lease expires</text><polygon points="420,216 520,256 420,296 320,256" fill="#f5f5f5" stroke="#4f5d75"/><text x="420" y="252" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Submission known</text><text x="420" y="270" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">not to have begun?</text><polygon points="420,328 520,368 420,408 320,368" fill="#f5f5f5" stroke="#4f5d75"/><text x="420" y="364" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Saved remote</text><text x="420" y="382" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">job ID?</text><polygon points="420,440 520,480 420,520 320,480" fill="#f5f5f5" stroke="#4f5d75"/><text x="420" y="476" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Endpoint guarantees</text><text x="420" y="494" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">idempotency?</text><rect x="704" y="228" width="176" height="56" rx="20" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="792.0" y="252" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Return to queue</text><text x="792.0" y="272" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">no prior submission</text><rect x="704" y="340" width="176" height="56" rx="20" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="792.0" y="364" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Resume observation</text><text x="792.0" y="384" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">same provider job</text><rect x="704" y="452" width="176" height="56" rx="20" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="792.0" y="476" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Retry safely</text><text x="792.0" y="496" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">same key + payload</text><rect x="64" y="452" width="176" height="56" rx="20" fill="#f5f5f5" stroke="#bf4520" stroke-width="2"/><text x="152.0" y="476" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">outcome_unknown</text><text x="152.0" y="496" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">preserve uncertainty</text><line x1="40" y1="540" x2="920" y2="540" stroke="#bfc0c0"/><text x="40" y="564" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">Lease recovery only. All resumed work still obeys deadlines, quota and financial limits.</text><text x="40" y="580" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">Timeout retry options and explicit duplicate-cost policies are described separately in Execution.</text></svg></div></div></body></html>
