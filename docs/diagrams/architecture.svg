<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root"><title id="architecture-title">How your application connects to UAI</title><desc id="architecture-desc">A trusted application backend calls UAI, whose API, workers and scheduler coordinate durable accounting, providers, queues and temporary storage.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #architecture-root .diagram-container { overflow-x: visible; }</style><marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker></defs><rect width="960" height="600" fill="#f5f5f5"/><text x="40" y="72" font-family="'Instrument Serif',serif" font-size="28" font-weight="400" fill="#2d3142" text-anchor="start">How your application connects to UAI</text><text x="40" y="100" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#4f5d75" text-anchor="start">ARCHITECTURE · SELECTED DEPENDENCIES</text><rect x="40" y="132" width="176" height="384" rx="8" fill="#ececec" stroke="#bfc0c0"/><text x="52" y="152" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#4f5d75" text-anchor="start">YOUR APPLICATION</text><rect x="248" y="132" width="448" height="384" rx="8" fill="#ececec" stroke="#bfc0c0"/><text x="260" y="152" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#4f5d75" text-anchor="start">UAI INSTALLATION</text><rect x="728" y="132" width="192" height="384" rx="8" fill="#ececec" stroke="#bfc0c0"/><text x="740" y="152" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#4f5d75" text-anchor="start">CONNECTED SERVICES</text><path d="M 200,216 H 280" fill="none" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#architecture-arrow-link)"/><path d="M 456,216 H 504" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#architecture-arrow)"/><path d="M 680,216 H 744" fill="none" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#architecture-arrow-link)"/><path d="M 368,256 V 352" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#architecture-arrow)"/><path d="M 592,256 V 352" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#architecture-arrow)"/><path d="M 368,448 V 416" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#architecture-arrow)"/><path d="M 640,256 V 288 Q 640,296 648,296 H 824 Q 832,296 832,304 V 352" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#architecture-arrow)"/><rect x="206.0" y="191" width="68" height="16" fill="#f5f5f5"/><text x="240" y="202" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">SERVER API</text><rect x="462.0" y="191" width="36" height="16" fill="#f5f5f5"/><text x="480" y="202" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">WORK</text><rect x="378.0" y="295" width="84" height="16" fill="#f5f5f5"/><text x="420" y="306" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">DURABLE STATE</text><rect x="602.0" y="307" width="84" height="16" fill="#f5f5f5"/><text x="644" y="318" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">QUEUE / QUOTA</text><rect x="758.0" y="271" width="44" height="16" fill="#f5f5f5"/><text x="780" y="282" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">FILES</text><rect x="56" y="176" width="144" height="80" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="128.0" y="204" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">App backend</text><text x="128.0" y="224" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">trusted identity</text><rect x="280" y="176" width="176" height="80" rx="6" fill="#f5f5f5" stroke="#bf4520" stroke-width="2"/><text x="368.0" y="204" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">UAI API</text><text x="368.0" y="224" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">quotes / operations</text><rect x="504" y="176" width="176" height="80" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="592.0" y="204" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Workers</text><text x="592.0" y="224" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">execute / settle</text><rect x="744" y="176" width="160" height="80" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="824.0" y="204" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Providers</text><text x="824.0" y="224" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">model / paid API</text><rect x="280" y="352" width="176" height="64" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="368.0" y="380" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">PostgreSQL</text><text x="368.0" y="400" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">journal / state</text><rect x="504" y="352" width="176" height="64" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="592.0" y="380" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Redis / BullMQ</text><text x="592.0" y="400" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">distributed mode</text><rect x="744" y="352" width="160" height="64" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="824.0" y="380" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Blob storage</text><text x="824.0" y="400" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">temporary content</text><rect x="280" y="448" width="176" height="56" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="368.0" y="476" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Scheduler</text><text x="368.0" y="496" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">recovery / cleanup</text><line x1="40" y1="540" x2="920" y2="540" stroke="#bfc0c0"/><text x="40" y="564" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">Selected paths only. All UAI roles share PostgreSQL; storage is local or S3-compatible.</text></svg>
