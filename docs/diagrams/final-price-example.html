<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How a fixed customer price is built</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { height: auto; width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body><div class="frame"><div class="diagram-container"><svg width="960" height="600" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="final-price-example-title final-price-example-desc"><title id="final-price-example-title">How a fixed customer price is built</title><desc id="final-price-example-desc">A synthetic cost estimate of 0.010 USD receives a 20 percent safety buffer and 25 percent markup, producing a final quoted price of 0.015 USD or 15 credits.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker></defs><rect width="960" height="600" fill="#f5f5f5"/><text x="40" y="72" font-family="'Instrument Serif',serif" font-size="28" font-weight="400" fill="#2d3142" text-anchor="start">How a fixed customer price is built</text><text x="40" y="100" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#4f5d75" text-anchor="start">WATERFALL · SYNTHETIC QUOTED_FINAL EXAMPLE</text><line x1="88" y1="468" x2="896" y2="468" stroke="#2d3142" stroke-opacity="0.12"/><text x="76" y="471" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="end">$0.000</text><line x1="88" y1="396.000" x2="896" y2="396.000" stroke="#2d3142" stroke-opacity="0.12"/><text x="76" y="399.000" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="end">$0.004</text><line x1="88" y1="324.000" x2="896" y2="324.000" stroke="#2d3142" stroke-opacity="0.12"/><text x="76" y="327.000" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="end">$0.008</text><line x1="88" y1="252.000" x2="896" y2="252.000" stroke="#2d3142" stroke-opacity="0.12"/><text x="76" y="255.000" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="end">$0.012</text><line x1="88" y1="180.000" x2="896" y2="180.000" stroke="#2d3142" stroke-opacity="0.12"/><text x="76" y="183.000" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="end">$0.016</text><text x="88" y="152" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">USD · illustrative values</text><rect x="128" y="288.00" width="128" height="180.00" fill="#f5f5f5"/><rect x="128" y="288.00" width="128" height="180.00" fill="#2d3142" fill-opacity="0.12" stroke="#2d3142" data-role="total" data-value="0.010" data-name="Estimated cost"/><text x="192" y="280.00" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="400" fill="#2d3142" text-anchor="middle">$0.010</text><text x="192" y="492" font-family="'Geist',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142" text-anchor="middle">Estimated cost</text><line x1="256" y1="288.00" x2="328" y2="288.00" stroke="#4f5d75" data-carry="0.010"/><rect x="328" y="252.000" width="128" height="36.000" fill="#f5f5f5"/><rect x="328" y="252.000" width="128" height="36.000" fill="#4f5d75" fill-opacity="0.12" stroke="#4f5d75" data-role="delta" data-value="+0.002" data-name="Safety buffer"/><text x="392" y="244.000" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">+$0.002</text><text x="392" y="492" font-family="'Geist',system-ui,sans-serif" font-size="11" font-weight="600" fill="#4f5d75" text-anchor="middle">Safety buffer</text><line x1="456" y1="252.000" x2="528" y2="252.000" stroke="#4f5d75" data-carry="0.012"/><rect x="528" y="198.000" width="128" height="54.000" fill="#f5f5f5"/><rect x="528" y="198.000" width="128" height="54.000" fill="#4f5d75" fill-opacity="0.12" stroke="#4f5d75" data-role="delta" data-value="+0.003" data-name="Markup"/><text x="592" y="190.000" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">+$0.003</text><text x="592" y="492" font-family="'Geist',system-ui,sans-serif" font-size="11" font-weight="600" fill="#4f5d75" text-anchor="middle">Markup</text><line x1="656" y1="198.000" x2="728" y2="198.000" stroke="#4f5d75" data-carry="0.015"/><rect x="728" y="198.000" width="128" height="270.000" fill="#f5f5f5"/><rect x="728" y="198.000" width="128" height="270.000" fill="#bf4520" fill-opacity="0.12" stroke="#bf4520" data-role="total" data-value="0.015" data-name="Final price"/><text x="792" y="190.000" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="400" fill="#bf4520" text-anchor="middle">$0.015</text><text x="792" y="492" font-family="'Geist',system-ui,sans-serif" font-size="11" font-weight="600" fill="#bf4520" text-anchor="middle">Final price</text><text x="392" y="512" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">20% of $0.010</text><text x="592" y="512" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">25% of $0.012</text><text x="792" y="516" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" fill="#bf4520" text-anchor="middle">15 credits</text><line x1="40" y1="540" x2="920" y2="540" stroke="#bfc0c0"/><text x="40" y="564" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">Example only: quoted_final price = estimated cost × 1.20 × 1.25, then credit-unit rounding.</text><text x="40" y="580" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">Anchored bars show totals; floating bars show additions. These are not provider rates or guaranteed profit.</text></svg></div></div></body></html>
